<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - TechStore</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">TechStore</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html" class="active">Products</a></li>
                <li><a href="acerca-de.html">About</a></li>
                <li><a href="contacto.html">Contact</a></li>
                <li class="cart-link"><a href="carrito.html"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-count">(0)</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- Products Page -->
    <section class="products-page">
        <div class="container">
            <h1>Our Products</h1>
            
            <!-- Filters -->
            <div class="filters">
                <h3>Filter by Category</h3>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterProducts('all')">All</button>
                    <button class="filter-btn" onclick="filterProducts('laptops')">Laptops</button>
                    <button class="filter-btn" onclick="filterProducts('smartphones')">Smartphones</button>
                    <button class="filter-btn" onclick="filterProducts('tablets')">Tablets</button>
                    <button class="filter-btn" onclick="filterProducts('accesorios')">Accessories</button>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="productosContainer">
                <div style="text-align: center; padding: 40px; grid-column: 1/-1;">
                    <p>⏳ Cargando productos...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div>
                    <h4>TechStore</h4>
                    <p>Your trusted technology store</p>
                </div>
                <div>
                    <h4>Follow Us</h4>
                    <p>Facebook | Twitter | Instagram</p>
                </div>
                <div>
                    <h4>Contact</h4>
                    <p>info@techstore.com | +1 234 567 89</p>
                </div>
            </div>
            <p class="copyright">&copy; 2025 TechStore. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
