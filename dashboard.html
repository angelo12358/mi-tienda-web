<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Base de Datos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        tr:hover {
            background: #f5f5f5;
            transition: background 0.2s ease;
        }

        tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 1024px) {
            table {
                font-size: 13px;
            }
            
            td, th {
                padding: 8px 10px;
            }
            
            .btn-sm {
                padding: 4px 8px;
                font-size: 11px;
            }
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 16px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-sm:active {
            transform: scale(0.95);
        }

        .btn-marcar {
            background: #3b82f6;
            color: white;
        }

        .btn-marcar:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-borrar {
            background: #ef4444;
            color: white;
        }

        .btn-borrar:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-borrar-todos {
            background: #dc2626;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-estado {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-estado.pendiente {
            background: #fbbf24;
            color: #000;
        }

        .btn-estado.pendiente:hover {
            background: #f59e0b;
        }

        .btn-estado.entregado {
            background: #10b981;
            color: white;
        }

        .btn-estado.entregado:hover {
            background: #059669;
        }

        .pedido-detalles {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
        }

        .items-lista {
            margin-top: 10px;
        }

        .item-producto {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            flex: 1;
        }

        .item-cantidad {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .formulario-producto {
            background: #f3f4f6;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .formulario-producto h3 {
            color: #667eea;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #374151;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-form {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-form.guardar {
            background: #10b981;
            color: white;
        }

        .btn-form.guardar:hover {
            background: #059669;
        }

        .btn-form.cancelar {
            background: #ef4444;
            color: white;
        }

        .btn-form.cancelar:hover {
            background: #dc2626;
        }

        .producto-acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-editar {
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-editar:hover {
            background: #2563eb;
        }

        .btn-eliminar {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-eliminar:hover {
            background: #dc2626;
        }

        .producto-row {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 20px;
            align-items: start;
        }

        .producto-imagen {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
        }

        .producto-imagen-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 40px;
        }

        .producto-detalles {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .producto-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .producto-titulo {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
        }

        .producto-precio {
            font-size: 24px;
            font-weight: bold;
            color: #10b981;
        }

        .producto-categoria {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .producto-descripcion {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .producto-acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .badge-no-leido {
            display: inline-block;
            padding: 4px 8px;
            background: #fef2f2;
            color: #7f1d1d;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }

        tr.leido {
            opacity: 0.6;
            background: #f9fafb;
        }

        .status-pending {
            background: #ffd700;
            color: black;
        }

        .status-completed {
            background: #10b981;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: #764ba2;
        }

        .price-cell {
            font-weight: bold;
            color: #10b981;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
        }

        .connection-status {
            display: inline-block;
            padding: 10px 15px;
            background: white;
            color: #667eea;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .connection-status.connected {
            background: #10b981;
            color: white;
        }

        .connection-status.disconnected {
            background: #ef4444;
            color: white;
        }
        /* ===== Celular ===== */
        @media (max-width: 640px) {
            body { padding: 10px; }
            h1 { font-size: 1.6em; margin-bottom: 15px; }
            .tab-btn { padding: 10px 12px; font-size: 13px; }
            .tab-content { padding: 15px; overflow-x: auto; }
            .stats { grid-template-columns: 1fr; gap: 10px; }
            .stat-card .number { font-size: 26px; }

            /* Productos: imagen arriba, datos abajo */
            .producto-row { grid-template-columns: 1fr; gap: 12px; }
            .producto-imagen,
            .producto-imagen-placeholder { width: 100%; height: 180px; }
            .producto-header { flex-wrap: wrap; gap: 8px; }
            .producto-precio { font-size: 20px; }
            .producto-info,
            .form-grid-2 { grid-template-columns: 1fr !important; gap: 6px !important; }

            /* Tablas (pedidos, contactos): se deslizan de lado */
            table { min-width: 560px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Dashboard de Base de Datos</h1>

        <div style="text-align: center;">
            <div class="connection-status" id="connectionStatus">
                🔴 Conectando...
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('productos')">📦 Productos</button>
            <button class="tab-btn" onclick="switchTab('pedidos')">🛒 Pedidos</button>
            <button class="tab-btn" onclick="switchTab('items')">📋 Items de Pedidos</button>
            <button class="tab-btn" onclick="switchTab('contactos')">📧 Contactos</button>
        </div>

        <!-- PRODUCTOS -->
        <div id="productos" class="tab-content active">
            <button class="refresh-btn" onclick="cargarProductos()">🔄 Actualizar</button>
            <div class="stats" id="productosStats"></div>
            <div id="productosContent"></div>
        </div>

        <!-- PEDIDOS -->
        <div id="pedidos" class="tab-content">
            <button class="refresh-btn" onclick="cargarPedidos()">🔄 Actualizar</button>
            <div class="stats" id="pedidosStats"></div>
            <div id="pedidosContent"></div>
        </div>

        <!-- ITEMS PEDIDOS -->
        <div id="items" class="tab-content">
            <button class="refresh-btn" onclick="cargarItems()">🔄 Actualizar</button>
            <div id="itemsContent"></div>
        </div>

        <!-- CONTACTOS -->
        <div id="contactos" class="tab-content">
            <button class="refresh-btn" onclick="cargarContactos()">🔄 Actualizar</button>
            <div class="stats" id="contactosStats"></div>
            <div id="contactosContent"></div>
        </div>

        <div class="footer">
            <p>🔗 Base de datos: <strong>Supabase</strong></p>
            <p style="font-size: 12px; margin-top: 10px; opacity: 0.8;">
                Ya no hace falta correr <code>npm start</code>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // `supabaseClient` viene de supabase-config.js

        // Lista de contactos cargada (se usa para borrar todos los leídos)
        let contactosCargados = [];

        // `leido` puede venir como boolean (true/false) o entero (1/0)
        function estaLeido(c) {
            return c.leido === true || Number(c.leido) === 1;
        }

        // Cambiar pestaña
        function switchTab(tabName) {
            // Ocultar todas las pestañas
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Mostrar pestaña seleccionada
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Cargar datos
            if (tabName === 'productos') cargarProductos();
            if (tabName === 'pedidos') cargarPedidos();
            if (tabName === 'items') cargarItems();
            if (tabName === 'contactos') cargarContactos();
        }

        // Comprobar conexión
        async function comprobarConexion() {
            try {
                const { error } = await supabaseClient.from('productos').select('id').limit(1);
                if (error) throw error;
                document.getElementById('connectionStatus').textContent = '🟢 Base de datos conectada';
                document.getElementById('connectionStatus').classList.add('connected');
                return true;
            } catch (error) {
                console.error('Error de conexión:', error);
                document.getElementById('connectionStatus').innerHTML = '🔴 Error: No se pudo conectar con Supabase';
                document.getElementById('connectionStatus').classList.add('disconnected');
                return false;
            }
        }

        // CARGAR PRODUCTOS
        async function cargarProductos() {
            const content = document.getElementById('productosContent');
            content.innerHTML = '<div class="loading">⏳ Cargando productos...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('productos')
                    .select('*')
                    .order('id', { ascending: true });
                if (error) throw error;
                const productos = (data || []).map(p => ({ ...p, precio: Number(p.precio) }));

                if (productos.length === 0) {
                    content.innerHTML = '<div class="empty-message">📭 No hay productos guardados</div>';
                    document.getElementById('productosStats').innerHTML = '';
                    return;
                }

                // Estadísticas
                const totalProductos = productos.length;
                const precioPromedio = (productos.reduce((sum, p) => sum + p.precio, 0) / totalProductos).toFixed(2);
                const productoMasCaro = productos.reduce((max, p) => p.precio > max.precio ? p : max);

                document.getElementById('productosStats').innerHTML = `
                    <div class="stat-card">
                        <h3>Total de Productos</h3>
                        <div class="number">${totalProductos}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Precio Promedio</h3>
                        <div class="number">$${precioPromedio}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Producto Más Caro</h3>
                        <div class="number">$${Number(productoMasCaro.precio).toFixed(2)}</div>
                    </div>
                `;

                // Formulario para agregar nuevo producto
                let html = `
                    <div class="formulario-producto" id="formProducto">
                        <h3>➕ Agregar Nuevo Producto</h3>
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="prodNombre" placeholder="Nombre del producto" required>
                        </div>
                        <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label>Precio *</label>
                                <input type="number" id="prodPrecio" placeholder="0.00" min="0" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label>Categoría</label>
                                <select id="prodCategoria">
                                    <option value="general">General</option>
                                    <option value="laptops">Laptops</option>
                                    <option value="smartphones">Smartphones</option>
                                    <option value="tablets">Tablets</option>
                                    <option value="accesorios">Accesorios</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea id="prodDescripcion" placeholder="Descripción del producto"></textarea>
                        </div>
                        <div class="form-group">
                            <label>URL de imagen</label>
                            <input type="text" id="prodImagen" placeholder="https://..." onchange="mostrarPreviewImagen()" oninput="mostrarPreviewImagen()">
                            <div id="imagenPreview" style="margin-top: 10px; max-width: 200px;">
                                <img id="imagenPreviewImg" style="max-width: 100%; border-radius: 6px; border: 1px solid #e5e7eb; display: none;">
                            </div>
                        </div>
                        <div class="form-buttons">
                            <button class="btn-form guardar" onclick="guardarProducto()">💾 Guardar Producto</button>
                            <button class="btn-form cancelar" onclick="limpiarFormulario()">❌ Limpiar</button>
                        </div>
                    </div>
                `;

                // Lista de productos
                html += '<h3 style="margin-top: 30px; color: #1f2937;">📦 Productos Disponibles</h3>';
                productos.forEach(p => {
                    html += `
                        <div class="producto-row">
                            <div>
                                ${p.imagen ? `<img src="${p.imagen}" alt="${p.nombre}" class="producto-imagen" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
                                <div class="producto-imagen-placeholder" ${p.imagen ? 'style="display: none;"' : ''}>📷</div>
                            </div>
                            <div class="producto-detalles">
                                <div class="producto-header">
                                    <div>
                                        <div class="producto-titulo">${p.nombre}</div>
                                        <span class="producto-categoria">${p.categoria || 'Sin categoría'}</span>
                                    </div>
                                    <div class="producto-precio">$${Number(p.precio).toFixed(2)}</div>
                                </div>
                                ${p.descripcion ? `<div class="producto-descripcion">${p.descripcion}</div>` : ''}
                                <div class="producto-info" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 13px; margin-top: 8px;">
                                    <div><strong>ID:</strong> ${p.id}</div>
                                    <div><strong>Stock:</strong> ${p.stock || 0} unidades</div>
                                    <div><strong>URL:</strong> <code style="font-size: 11px; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; word-break: break-all;">${p.imagen ? p.imagen.substring(0, 25) + '...' : 'Sin imagen'}</code></div>
                                </div>
                                <div class="producto-acciones">
                                    <button class="btn-editar" onclick="editarProducto(${p.id})">✏️ Editar</button>
                                    <button class="btn-eliminar" onclick="eliminarProducto(${p.id})">🗑️ Eliminar</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="empty-message">❌ Error: ${error.message}</div>`;
            }
        }

        // Mostrar preview de imagen
        function mostrarPreviewImagen() {
            const urlImagen = document.getElementById('prodImagen').value.trim();
            const previewImg = document.getElementById('imagenPreviewImg');
            
            if (urlImagen) {
                previewImg.src = urlImagen;
                previewImg.style.display = 'block';
                previewImg.onerror = function() {
                    this.style.display = 'none';
                };
            } else {
                previewImg.style.display = 'none';
            }
        }

        // Guardar nuevo producto
        async function guardarProducto() {
            const nombre = document.getElementById('prodNombre').value.trim();
            const precio = parseFloat(document.getElementById('prodPrecio').value);
            const descripcion = document.getElementById('prodDescripcion').value.trim();
            const categoria = document.getElementById('prodCategoria').value;
            const imagen = document.getElementById('prodImagen').value.trim();

            if (!nombre || !precio) {
                alert('❌ Por favor completa Nombre y Precio');
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('productos')
                    .insert({
                        nombre,
                        precio,
                        descripcion: descripcion || '',
                        categoria: categoria || 'general',
                        imagen: imagen || ''
                    });
                if (error) throw error;

                alert('✅ Producto creado correctamente');
                limpiarFormulario();
                cargarProductos();
            } catch (error) {
                alert('❌ Error al crear producto: ' + error.message);
            }
        }

        // Editar producto
        async function editarProducto(id) {
            try {
                const { data: producto, error } = await supabaseClient
                    .from('productos')
                    .select('*')
                    .eq('id', id)
                    .single();
                if (error) throw error;

                document.getElementById('prodNombre').value = producto.nombre;
                document.getElementById('prodPrecio').value = Number(producto.precio);
                document.getElementById('prodDescripcion').value = producto.descripcion || '';
                document.getElementById('prodCategoria').value = producto.categoria || 'general';
                document.getElementById('prodImagen').value = producto.imagen || '';

                // Cambiar botón a actualizar
                const form = document.getElementById('formProducto');
                const btn = form.querySelector('.btn-form.guardar');
                btn.textContent = '💾 Actualizar Producto';
                btn.onclick = () => actualizarProducto(id);

                // Scroll al formulario
                form.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                alert('❌ Error al cargar producto: ' + error.message);
            }
        }

        // Actualizar producto
        async function actualizarProducto(id) {
            const nombre = document.getElementById('prodNombre').value.trim();
            const precio = parseFloat(document.getElementById('prodPrecio').value);
            const descripcion = document.getElementById('prodDescripcion').value.trim();
            const categoria = document.getElementById('prodCategoria').value;
            const imagen = document.getElementById('prodImagen').value.trim();

            if (!nombre || !precio) {
                alert('❌ Por favor completa Nombre y Precio');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('productos')
                    .update({
                        nombre,
                        precio,
                        descripcion: descripcion || '',
                        categoria: categoria || 'general',
                        imagen: imagen || ''
                    })
                    .eq('id', id)
                    .select();
                if (error) throw error;
                if (!data || data.length === 0) throw new Error('No se actualizó ninguna fila (revisa las políticas RLS de UPDATE)');

                alert('✅ Producto actualizado correctamente');
                limpiarFormulario();
                cargarProductos();
            } catch (error) {
                alert('❌ Error al actualizar: ' + error.message);
            }
        }

        // Eliminar producto
        async function eliminarProducto(id) {
            if (!confirm('¿Estás seguro de que quieres eliminar este producto?')) return;

            try {
                const { data, error } = await supabaseClient
                    .from('productos')
                    .delete()
                    .eq('id', id)
                    .select();
                if (error) throw error;
                if (!data || data.length === 0) throw new Error('No se eliminó ninguna fila (revisa las políticas RLS de DELETE)');

                alert('✅ Producto eliminado correctamente');
                cargarProductos();
            } catch (error) {
                alert('❌ Error al eliminar: ' + error.message);
            }
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodDescripcion').value = '';
            document.getElementById('prodCategoria').value = 'general';
            document.getElementById('prodImagen').value = '';
            document.getElementById('imagenPreviewImg').style.display = 'none';

            // Restaurar botón a crear
            const form = document.getElementById('formProducto');
            const btn = form.querySelector('.btn-form.guardar');
            btn.textContent = '💾 Guardar Producto';
            btn.onclick = () => guardarProducto();
        }

        // CARGAR PEDIDOS
        async function cargarPedidos() {
            const content = document.getElementById('pedidosContent');
            content.innerHTML = '<div class="loading">⏳ Cargando pedidos...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('pedidos')
                    .select('*')
                    .order('fecha', { ascending: false });
                if (error) throw error;
                const pedidos = (data || []).map(p => ({ ...p, total: Number(p.total) }));

                // Traer todos los items de una sola vez y agruparlos por pedido
                const itemsPorPedido = await obtenerItemsPorPedido();

                if (pedidos.length === 0) {
                    content.innerHTML = '<div class="empty-message">📭 No hay pedidos guardados</div>';
                    document.getElementById('pedidosStats').innerHTML = '';
                    return;
                }

                // Estadísticas
                const totalPedidos = pedidos.length;
                const totalVentas = pedidos.reduce((sum, p) => sum + p.total, 0).toFixed(2);
                const ventaPromedio = (totalVentas / totalPedidos).toFixed(2);
                const entregados = pedidos.filter(p => p.estado === 'entregado').length;

                document.getElementById('pedidosStats').innerHTML = `
                    <div class="stat-card">
                        <h3>Total de Pedidos</h3>
                        <div class="number">${totalPedidos}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total de Ventas</h3>
                        <div class="number">$${totalVentas}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Entregados</h3>
                        <div class="number" style="color: #10b981;">${entregados}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Venta Promedio</h3>
                        <div class="number">$${ventaPromedio}</div>
                    </div>
                `;

                // Tabla
                let html = '<table><tr><th>ID Pedido</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Productos</th></tr>';
                
                for (const p of pedidos) {
                    const estado = p.estado || 'pendiente';
                    const badgeClass = estado === 'entregado' ? 'status-completed' : 'status-pending';
                    const fecha = new Date(p.fecha).toLocaleDateString('es-ES', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    // Obtener items del pedido
                    let itemsHtml = '<div class="pedido-detalles"><div class="items-lista">Sin productos</div></div>';
                    try {
                        const items = itemsPorPedido[p.id] || [];

                        if (items.length > 0) {
                            itemsHtml = '<div class="pedido-detalles"><div class="items-lista">';
                            items.forEach(item => {
                                itemsHtml += `
                                    <div class="item-producto">
                                        <div class="item-info">
                                            <strong>${item.nombre_producto || 'Producto'}</strong><br>
                                            Precio unitario: $${Number(item.precio_unitario).toFixed(2)}<br>
                                            <small style="color: #666;">Subtotal: $${(Number(item.precio_unitario) * item.cantidad).toFixed(2)}</small>
                                        </div>
                                        <div class="item-cantidad">x${item.cantidad}</div>
                                    </div>
                                `;
                            });
                            itemsHtml += '</div></div>';
                        }
                    } catch (error) {
                        itemsHtml = '<div class="pedido-detalles"><div class="items-lista">Error al cargar productos</div></div>';
                    }

                    // Botón para cambiar estado
                    const nuevoEstado = estado === 'entregado' ? 'pendiente' : 'entregado';
                    const btnEstadoClass = estado === 'entregado' ? 'entregado' : 'pendiente';
                    const btnTexto = estado === 'entregado' ? '✓ Entregado' : '⏳ Pendiente';
                    
                    html += `
                        <tr>
                            <td><strong>#${p.id}</strong></td>
                            <td>${fecha}</td>
                            <td class="price-cell">$${Number(p.total).toFixed(2)}</td>
                            <td><span class="status-badge ${badgeClass}">${estado.toUpperCase()}</span></td>
                            <td>
                                ${itemsHtml}
                                <button class="btn-estado ${btnEstadoClass}" onclick="cambiarEstadoPedido(${p.id}, '${nuevoEstado}')">${btnTexto}</button>
                            </td>
                        </tr>
                    `;
                }
                html += '</table>';
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="empty-message">❌ Error: ${error.message}</div>`;
            }
        }

        // Obtener todos los items y agruparlos por pedido_id
        async function obtenerItemsPorPedido() {
            const { data, error } = await supabaseClient
                .from('pedido_items')
                .select('*')
                .order('id', { ascending: true });
            if (error) throw error;

            const agrupados = {};
            (data || []).forEach(item => {
                if (!agrupados[item.pedido_id]) agrupados[item.pedido_id] = [];
                agrupados[item.pedido_id].push(item);
            });
            return agrupados;
        }

        // Cambiar estado del pedido
        async function cambiarEstadoPedido(pedidoId, nuevoEstado) {
            const btn = event.target;
            btn.disabled = true;
            const textOriginal = btn.textContent;
            btn.textContent = '⏳ Actualizando...';

            try {
                console.log(`Cambiando pedido ${pedidoId} a estado: ${nuevoEstado}`);
                const { data, error } = await supabaseClient
                    .from('pedidos')
                    .update({ estado: nuevoEstado })
                    .eq('id', pedidoId)
                    .select();
                if (error) throw error;
                if (!data || data.length === 0) throw new Error('No se actualizó ninguna fila (revisa las políticas RLS de UPDATE)');

                console.log('✅ Estado actualizado');
                alert(`✅ Pedido actualizado a: ${nuevoEstado}`);
                cargarPedidos();
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al actualizar: ' + error.message);
                btn.disabled = false;
                btn.textContent = textOriginal;
            }
        }

        // CARGAR ITEMS PEDIDOS
        async function cargarItems() {
            const content = document.getElementById('itemsContent');
            content.innerHTML = '<div class="loading">⏳ Cargando items de pedidos...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('pedidos')
                    .select('*')
                    .order('fecha', { ascending: false });
                if (error) throw error;
                const pedidos = data || [];

                if (pedidos.length === 0) {
                    content.innerHTML = '<div class="empty-message">📭 No hay items de pedidos</div>';
                    return;
                }

                const itemsPorPedido = await obtenerItemsPorPedido();

                // Crear una tabla con los items de cada pedido
                let html = '';
                pedidos.forEach(p => {
                    const fecha = new Date(p.fecha).toLocaleDateString('es-ES');
                    html += `
                        <h3 style="margin-top: 30px; margin-bottom: 15px; color: #667eea;">
                            📦 Pedido #${p.id} - ${fecha} - Total: $${Number(p.total).toFixed(2)}
                        </h3>
                        <table><tr><th>Producto</th><th>Cantidad</th><th>Precio Unitario</th><th>Subtotal</th></tr>
                    `;
                    const items = itemsPorPedido[p.id] || [];
                    if (items.length === 0) {
                        html += '<tr><td colspan="4">Sin productos</td></tr>';
                    }
                    items.forEach(item => {
                        const precio = Number(item.precio_unitario);
                        html += `
                            <tr>
                                <td>${item.nombre_producto || 'Producto'}</td>
                                <td>${item.cantidad}</td>
                                <td>$${precio.toFixed(2)}</td>
                                <td>$${(precio * item.cantidad).toFixed(2)}</td>
                            </tr>
                        `;
                    });
                    html += '</table>';
                });

                if (html === '') {
                    content.innerHTML = '<div class="empty-message">📭 No hay detalles de items</div>';
                } else {
                    content.innerHTML = html;
                }
            } catch (error) {
                content.innerHTML = `<div class="empty-message">❌ Error: ${error.message}</div>`;
            }
        }

        // CARGAR CONTACTOS
        async function cargarContactos() {
            const content = document.getElementById('contactosContent');
            content.innerHTML = '<div class="loading">⏳ Cargando contactos...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('contactos')
                    .select('*')
                    .order('fecha', { ascending: false });
                if (error) throw error;
                const contactos = data || [];
                contactosCargados = contactos;

                if (contactos.length === 0) {
                    content.innerHTML = '<div class="empty-message">📭 No hay mensajes de contacto</div>';
                    document.getElementById('contactosStats').innerHTML = '';
                    return;
                }

                // Contar leídos y no leídos
                const totalMensajes = contactos.length;
                const noLeidos = contactos.filter(c => !estaLeido(c)).length;
                const leidos = contactos.filter(c => estaLeido(c)).length;

                document.getElementById('contactosStats').innerHTML = `
                    <div class="stat-card">
                        <h3>Total de Mensajes</h3>
                        <div class="number">${totalMensajes}</div>
                    </div>
                    <div class="stat-card">
                        <h3>No Leídos</h3>
                        <div class="number" style="color: #fbbf24;">${noLeidos}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Leídos</h3>
                        <div class="number" style="color: #86efac;">${leidos}</div>
                    </div>
                `;

                // Botón para borrar todos los leídos
                let html = '';
                if (leidos > 0) {
                    html += `<button class="btn-borrar-todos" onclick="borrarTodosLeidos()">🗑️ Borrar todos los leídos (${leidos})</button>`;
                }

                // Tabla
                html += '<table><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Asunto</th><th>Mensaje</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr>';
                contactos.forEach(c => {
                    const fecha = new Date(c.fecha).toLocaleDateString('es-ES', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    const leido = estaLeido(c);
                    const estadoHtml = leido
                        ? '<span class="badge-leido">✓ LEÍDO</span>'
                        : '<span class="badge-no-leido">● NO LEÍDO</span>';
                    const claseFilaLeida = leido ? 'leido' : '';
                    
                    html += `
                        <tr class="${claseFilaLeida}">
                            <td>${c.id}</td>
                            <td><strong>${c.nombre}</strong></td>
                            <td>${c.email}</td>
                            <td>${c.asunto}</td>
                            <td>${c.mensaje}</td>
                            <td>${fecha}</td>
                            <td>${estadoHtml}</td>
                            <td>
                                <div class="action-buttons">
                                    ${!leido ? `<button class="btn-sm btn-marcar" onclick="marcarLeido(${c.id}, this)">Marcar leído</button>` : ''}
                                    <button class="btn-sm btn-borrar" onclick="borrarContacto(${c.id}, this)">Borrar</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                html += '</table>';
                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="empty-message">❌ Error: ${error.message}</div>`;
            }
        }

        // Marcar contacto como leído
        async function marcarLeido(id, btn) {
            btn.disabled = true;
            const textOriginal = btn.textContent;
            btn.textContent = '⏳ Marcando...';
            
            try {
                console.log(`Marcando contacto ${id} como leído...`);
                // Intentamos con boolean; si la columna es entera, reintentamos con 1
                let { data, error } = await supabaseClient
                    .from('contactos')
                    .update({ leido: true })
                    .eq('id', id)
                    .select();
                if (error) {
                    ({ data, error } = await supabaseClient
                        .from('contactos')
                        .update({ leido: 1 })
                        .eq('id', id)
                        .select());
                }
                if (error) throw error;
                if (!data || data.length === 0) throw new Error('No se actualizó ninguna fila (revisa las políticas RLS de UPDATE)');

                console.log('✅ Éxito al marcar como leído');
                cargarContactos();
            } catch (error) {
                console.error('❌ Error:', error);
                alert('❌ Error al marcar como leído: ' + error.message);
                btn.disabled = false;
                btn.textContent = textOriginal;
            }
        }

        // Borrar un contacto
        async function borrarContacto(id, btn) {
            if (!confirm('¿Estás seguro de que quieres borrar este mensaje?')) return;

            btn.disabled = true;
            const textOriginal = btn.textContent;
            btn.textContent = '⏳ Borrando...';
            
            try {
                console.log(`Intentando borrar contacto ${id}...`);
                const { data, error } = await supabaseClient
                    .from('contactos')
                    .delete()
                    .eq('id', id)
                    .select();
                if (error) throw error;
                if (!data || data.length === 0) throw new Error('No se eliminó ninguna fila (revisa las políticas RLS de DELETE)');

                console.log('✅ Éxito al borrar');
                alert('✅ Mensaje eliminado correctamente');
                cargarContactos();
            } catch (error) {
                console.error('❌ Error al borrar:', error);
                alert('❌ Error al borrar: ' + error.message);
                btn.disabled = false;
                btn.textContent = textOriginal;
            }
        }

        // Borrar todos los contactos leídos
        async function borrarTodosLeidos() {
            if (!confirm('¿Estás seguro de que quieres borrar TODOS los mensajes leídos?')) return;

            const btn = event.target;
            btn.disabled = true;
            const textOriginal = btn.textContent;
            btn.textContent = '⏳ Borrando...';
            
            try {
                console.log('Borrando todos los contactos leídos...');
                // Borramos por id los contactos leídos de la lista cargada
                const ids = contactosCargados.filter(c => estaLeido(c)).map(c => c.id);
                if (ids.length === 0) {
                    alert('No hay mensajes leídos para borrar');
                    cargarContactos();
                    return;
                }

                const { data, error } = await supabaseClient
                    .from('contactos')
                    .delete()
                    .in('id', ids)
                    .select();
                if (error) throw error;

                const borrados = data ? data.length : 0;
                console.log(`✅ ${borrados} contactos eliminados`);
                alert(`✅ ${borrados} contactos eliminados`);
                cargarContactos();
            } catch (error) {
                console.error('❌ Error al borrar:', error);
                alert('❌ Error al borrar: ' + error.message);
                btn.disabled = false;
                btn.textContent = textOriginal;
            }
        }

        // Cargar datos al iniciar
        window.addEventListener('load', async () => {
            await comprobarConexion();
            await cargarProductos();
        });
    </script>
</body>
</html>
